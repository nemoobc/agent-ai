name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v4 # pin: actions/checkout@11bd71901bbe5b1630ce7ea09f3b2d965984876457

      - name: Syntax + self-test (gate)
        run: |
          for s in install.sh skills/*/run.sh tests/self-test.sh; do
            bash -n "$s" || exit 1
          done
          bash tests/self-test.sh

      - name: Ekstrak catatan dari CHANGELOG
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          head -40 release-notes.md

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2 # pin: softprops/action-gh-release@da05d552573ad93b93904e8d7a1e2e46d37f0eb4f2
        with:
          body_path: release-notes.md
          generate_release_notes: true
