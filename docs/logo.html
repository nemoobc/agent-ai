<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENT AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0a0a1a;
    font-family: 'Arial', sans-serif;
  }
  .logo {
    text-align: center;
  }
  .logo h1 {
    font-size: 80px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #4facfe, #f093fb, #f5576c, #764ba2, #4facfe);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient 3s ease infinite;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .tagline {
    color: #8888aa;
    font-size: 14px;
    margin-top: 10px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="logo">
    <h1>AGENT AI</h1>
    <p class="tagline">otak utama • caveman mode permanen • ultronomatis</p>
  </div>
</body>
</html>
