<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENT AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0a0a1a;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }
  .logo {
    text-align: center;
    position: relative;
  }
  .logo h1 {
    font-size: 120px;
    font-weight: 900;
    letter-spacing: 12px;
    background: linear-gradient(90deg, #4facfe, #f093fb, #f5576c, #764ba2, #4facfe);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient 2s ease infinite, pulse 1.5s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #4facfe;
    border-radius: 50%;
    animation: float 3s ease-in-out infinite;
  }
  .particle:nth-child(1) { left: 10%; animation-delay: 0s; background: #4facfe; }
  .particle:nth-child(2) { left: 20%; animation-delay: 0.5s; background: #f093fb; }
  .particle:nth-child(3) { left: 30%; animation-delay: 1s; background: #f5576c; }
  .particle:nth-child(4) { left: 40%; animation-delay: 1.5s; background: #764ba2; }
  .particle:nth-child(5) { left: 50%; animation-delay: 0.3s; background: #4facfe; }
  .particle:nth-child(6) { left: 60%; animation-delay: 0.8s; background: #f093fb; }
  .particle:nth-child(7) { left: 70%; animation-delay: 1.3s; background: #f5576c; }
  .particle:nth-child(8) { left: 80%; animation-delay: 0.2s; background: #764ba2; }
  .particle:nth-child(9) { left: 90%; animation-delay: 0.7s; background: #4facfe; }
  @keyframes float {
    0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
    50% { transform: translateY(-20px) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="logo">
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <h1>AGENT AI</h1>
  </div>
</body>
</html>
