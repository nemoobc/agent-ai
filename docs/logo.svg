<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#f5576c;#764ba2;#f093fb;#4facfe" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#f093fb">
        <animate attributeName="stop-color" values="#f093fb;#4facfe;#f5576c;#764ba2;#f093fb" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#764ba2">
        <animate attributeName="stop-color" values="#764ba2;#f093fb;#4facfe;#f5576c;#764ba2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="700" height="120" fill="#0a0a1a" rx="10"/>
  <text x="350" y="75" font-family="Arial,sans-serif" font-size="72" font-weight="bold" fill="url(#g)" text-anchor="middle">AGENT AI</text>
</svg>
