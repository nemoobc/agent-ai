<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#f093fb;#f5576c;#764ba2;#4facfe" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f093fb">
        <animate attributeName="stop-color" values="#f093fb;#f5576c;#764ba2;#4facfe;#f093fb" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#764ba2">
        <animate attributeName="stop-color" values="#764ba2;#4facfe;#f093fb;#f5576c;#764ba2" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f093fb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="180" fill="#0a0a1a" rx="16"/>
  <rect x="50" y="88" width="800" height="2" fill="url(#line)" rx="1"/>
  <text x="450" y="90" font-family="Arial,sans-serif" font-size="96" font-weight="900" fill="url(#g)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">
    AGENT AI
    <animate attributeName="font-size" values="96;100;96" dur="2s" repeatCount="indefinite"/>
  </text>
  <circle cx="100" cy="90" r="3" fill="#4facfe" opacity="0">
    <animate attributeName="cy" values="180;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="90" r="2" fill="#f093fb" opacity="0">
    <animate attributeName="cy" values="180;0" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="90" r="2" fill="#f5576c" opacity="0">
    <animate attributeName="cy" values="180;0" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="90" r="3" fill="#764ba2" opacity="0">
    <animate attributeName="cy" values="180;0" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="90" r="2" fill="#4facfe" opacity="0">
    <animate attributeName="cy" values="180;0" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="90" r="2" fill="#f093fb" opacity="0">
    <animate attributeName="cy" values="180;0" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
