<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#f093fb;#f5576c;#764ba2;#4facfe" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f093fb">
        <animate attributeName="stop-color" values="#f093fb;#f5576c;#764ba2;#4facfe;#f093fb" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#764ba2">
        <animate attributeName="stop-color" values="#764ba2;#4facfe;#f093fb;#f5576c;#764ba2" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="150" fill="#0a0a1a" rx="12"/>
  <text x="400" y="75" font-family="Arial,sans-serif" font-size="90" font-weight="900" fill="url(#g)" text-anchor="middle" dominant-baseline="middle">
    AGENT AI
    <animate attributeName="font-size" values="90;95;90" dur="1.5s" repeatCount="indefinite"/>
  </text>
  <circle cx="50" cy="75" r="3" fill="#4facfe" opacity="0.6">
    <animate attributeName="cy" values="150;0;150" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="75" r="2" fill="#f093fb" opacity="0.6">
    <animate attributeName="cy" values="150;0;150" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="75" r="3" fill="#f5576c" opacity="0.6">
    <animate attributeName="cy" values="150;0;150" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="75" r="2" fill="#764ba2" opacity="0.6">
    <animate attributeName="cy" values="150;0;150" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
