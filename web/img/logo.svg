<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4"/>
      <stop offset="50%" style="stop-color:#bf40ff"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="url(#g2)" stroke="url(#g1)" stroke-width="2"/>
  
  <!-- Diamond shape -->
  <polygon points="50,12 82,50 50,88 18,50" fill="none" stroke="url(#g1)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Inner diamond -->
  <polygon points="50,24 70,50 50,76 30,50" fill="url(#g1)" opacity="0.15"/>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="url(#g1)" filter="url(#glow)"/>
  
  <!-- Orbital rings -->
  <ellipse cx="50" cy="50" rx="32" ry="12" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.4" transform="rotate(-30 50 50)"/>
  <ellipse cx="50" cy="50" rx="32" ry="12" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.4" transform="rotate(30 50 50)"/>
  
  <!-- Corner accents -->
  <circle cx="50" cy="12" r="3" fill="#ff69b4" filter="url(#glow)"/>
  <circle cx="82" cy="50" r="3" fill="#bf40ff" filter="url(#glow)"/>
  <circle cx="50" cy="88" r="3" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="18" cy="50" r="3" fill="#00ff9f" filter="url(#glow)"/>
</svg>
